services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sarkar_restaurant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d sarkar_restaurant"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:change-this-password@db:5432/sarkar_restaurant
      JWT_SECRET: replace-with-a-long-random-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: replace-before-use
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
volumes:
  pgdata:
