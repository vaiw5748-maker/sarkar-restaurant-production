<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sarkar Rider App</title><style>body{margin:0;background:#f5f8f6;font-family:Arial,"Noto Sans Bengali",sans-serif;color:#17251e}.wrap{max-width:700px;margin:auto;padding:20px 14px 80px}h1{font-size:28px}.card{background:#fff;border:1px solid #dce9e2;border-radius:17px;padding:15px;margin:12px 0;box-shadow:0 8px 20px #06351c10}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;margin:5px 0;border:1px solid #d4e2db;font:inherit}button{background:#087b4d;color:#fff;border:0;font-weight:900}.red{background:#a53127}.muted{color:#6d7a73;font-size:12px}.hidden{display:none}.order{border:1px solid #dce9e2;border-radius:13px;padding:12px;margin:9px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.map{background:#f0f7f3;padding:9px;border-radius:10px;margin-top:8px;font-size:12px}</style></head><body><main class="wrap"><h1>🛵 Rider App</h1><section id="login" class="card"><h2>Rider Login</h2><input id="phone" placeholder="মোবাইল নম্বর" inputmode="tel"><input id="password" placeholder="Password" type="password"><button onclick="login()">Login</button></section><section id="app" class="hidden"><div class="card"><button onclick="loadOrders()">Refresh Orders</button><button class="red" onclick="logout()">Logout</button><p id="gps" class="muted">Live GPS বন্ধ</p></div><div id="orders"></div></section></main><script>let token=localStorage.getItem('riderSession');const $=id=>document.getElementById(id);async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error(d.error||'Login required')}if(!r.ok)throw Error(d.error||'Request failed');return d}async function login(){try{let r=await fetch('/api/auth/rider/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:$('phone').value,password:$('password').value})});let d=await r.json();if(!r.ok)throw Error(d.error);localStorage.setItem('riderSession',d.token);token=d.token;show();loadOrders();startGPS()}catch(e){alert(e.message)}}function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden')}function logout(){localStorage.removeItem('riderSession');token='';location.reload()}async function loadOrders(){try{let list=await api('/api/rider/orders');$('orders').innerHTML=list.length?list.map(o=>`<div class="order"><b>#${esc(o.id)}</b><br>${esc(o.name)} · ${esc(o.phone)}<br>₹${o.total} · ${o.paymentMethod}<div class="map">📍 ${esc(o.address)}${o.landmark?' · '+esc(o.landmark):''}</div><div class="actions"><button onclick="goMap(${o.customerLat},${o.customerLon})">🗺️ Map</button><button onclick="status('${o.id}','OUT_FOR_DELIVERY')">🚚 Start Delivery</button><button onclick="status('${o.id}','DELIVERED')">✅ Delivered</button></div></div>`).join(''):'<div class="card muted">এখন কোনো assigned order নেই।'}catch(e){alert(e.message)}}async function status(id,s){try{await api('/api/rider/orders/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:s})});loadOrders()}catch(e){alert(e.message)}}function goMap(lat,lon){if(lat==null||lon==null)return alert('Customer GPS পাওয়া যায়নি');location.href='https://www.google.com/maps/dir/?api=1&destination='+lat+','+lon}function startGPS(){if(!navigator.geolocation)return; navigator.geolocation.watchPosition(async p=>{ $('gps').textContent='📍 Live GPS চলছে'; let list=[];try{list=await api('/api/rider/orders')}catch(e){return}for(const o of list.filter(x=>x.status==='OUT_FOR_DELIVERY')){try{await api('/api/rider/location',{method:'POST',body:JSON.stringify({orderId:o.id,latitude:p.coords.latitude,longitude:p.coords.longitude})})}catch(e){}}},e=>{$('gps').textContent='⚠️ GPS permission দিন'},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}if(token){show();loadOrders();startGPS()}setInterval(()=>token&&loadOrders(),10000)</script></body></html>
