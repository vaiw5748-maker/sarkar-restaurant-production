<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SARKAR Delivery</title>
<style>
body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f6f1e7;color:#24170b;margin:0}
.wrap{max-width:520px;margin:auto;padding:18px}
.box{background:#fff;border:1px solid #e3d5b9;border-radius:16px;padding:16px;margin:10px 0}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:800;background:#087b4d;color:#fff}
button.stop{background:#a33127}
#status{line-height:1.6}
.muted{color:#786c5d;font-size:12px}
</style>
</head>
<body>

<div class="wrap">
  <div class="box">
    <h2>🚴 SARKAR Delivery</h2>
    <div id="status">Tracking session যাচাই হচ্ছে...</div>
    <br>
    <button id="start" onclick="start()">Live Location চালু করুন</button>
    <button class="stop" onclick="stop()">বন্ধ করুন</button>
  </div>
</div>

<script>
const token=new URLSearchParams(location.search).get("token");
let watch=null;

function say(x){document.getElementById("status").innerHTML=x;}

async function verifyToken(){
  if(!token){
    say("❌ Delivery token নেই।");
    return false;
  }
  say("🟢 Tracking প্রস্তুত");
  return true;
}

async function send(pos){
  try{
    const r=await fetch("/api/delivery/location",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+token
      },
      body:JSON.stringify({
        latitude:pos.coords.latitude,
        longitude:pos.coords.longitude,
        accuracy:pos.coords.accuracy
      })
    });

    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"Update failed");

    say(`🟢 Live location পাঠানো হচ্ছে<br>
      <span class="muted">
      Order: ${d.orderId}<br>
      শেষ আপডেট: ${new Date().toLocaleTimeString("bn-BD")}
      </span>`);
  }catch(e){
    say("🔴 "+e.message);
  }
}

async function start(){
  const ok=await verifyToken();
  if(!ok) return;

  if(!navigator.geolocation){
    say("এই device geolocation support করে না।");
    return;
  }

  stop();

  watch=navigator.geolocation.watchPosition(
    send,
    e=>say("🔴 Location permission/error: "+e.message),
    {enableHighAccuracy:true,maximumAge:5000,timeout:15000}
  );

  say("📡 Location permission দিন...");
}

function stop(){
  if(watch!==null){
    navigator.geolocation.clearWatch(watch);
    watch=null;
    say("Tracking বন্ধ আছে।");
  }
}

verifyToken();
</script>

</body>
  </html>
